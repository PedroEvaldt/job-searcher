collect_every: 6h
digest:
  # Must match MODEL_VERSION in analyzer/jobradar/model/combined.py (the worker's model).
  model_version: "sklearn-combined-v7"
  # On v7's scale: about 5 new jobs a day pass 0.20 (docs/MODELING.md).
  min_score: 0.20
  max_age: 336h
  every: 6h
sources:
  - name: remoteok
    enabled: true
    url: https://remoteok.com/api
    timeout: 30s
    retries: 3
    initial_wait: 5s
    interval: 1s
  - name: remotive
    enabled: true
    url: https://remotive.com/api/remote-jobs
    timeout: 30s
    retries: 3
    initial_wait: 5s
    interval: 1s
  - name: himalayas
    enabled: true
    url: https://himalayas.app/jobs/api
    timeout: 120s
    retries: 3
    initial_wait: 20s
    interval: 1s
