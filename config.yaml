collect_every: 6h
digest:
  model_version: "jev-manual-qs-v1"
  min_score: 0.75
  every: 6h
sources:
  - name: remoteok
    enabled: true
    url: https://remoteok.com/api
    timeout: 30s
    retries: 3
    initial_wait: 5s
    interval: 1s
  - name: remotive
    enabled: true
    url: https://remotive.com/api/remote-jobs
    timeout: 30s
    retries: 3
    initial_wait: 5s
    interval: 1s
  - name: himalayas
    enabled: true
    url: https://himalayas.app/jobs/api
    timeout: 120s
    retries: 3
    initial_wait: 20s
    interval: 1s
