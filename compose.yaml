services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-searcher:latest
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    # pgvector's official image = postgres 16 + the `vector` extension preinstalled.
    # Same PG 16 major as postgres:16-alpine, so the existing data volume is reused as is.
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB "]
      interval: 10s
      timeout: 5s
      retries: 5

  analyzer:
    build:
      context: ./analyzer/
      dockerfile: ./Dockerfile
    image: analyzer:latest
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
  jev-worker:
    # Same image as analyzer, different command: the long-running Jev scorer.
    # Off by default (profile "jev"): without JEV_API_KEY the worker exits 1, and with
    # restart: unless-stopped that would be a restart loop. Turn it on with
    # COMPOSE_PROFILES=jev in .env, next to the key.
    profiles: ["jev"]
    image: analyzer:latest
    build:
      context: ./analyzer/
      dockerfile: ./Dockerfile
    command: ["uv", "run", "--no-dev", "--group", "jev", "python", "-m", "scripts.jev_worker"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      JEV_API_KEY: ${JEV_API_KEY}
      JEV_WORKER_INTERVAL_SECONDS: ${JEV_WORKER_INTERVAL_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres_data:
