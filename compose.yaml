services:
  migrate:
    # One-shot: applies the goose migrations and exits 0. Every other service waits for
    # it (service_completed_successfully), so none of them can start before the schema
    # exists. Without it, on a fresh database, analyzer, jev-worker and digest raced
    # ahead of the collector's own migrations and failed on missing tables.
    build:
      context: .
      dockerfile: Dockerfile
    image: job-searcher:latest
    command: ["./collector", "-migrate"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-searcher:latest
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    # pgvector's official image = postgres 16 + the `vector` extension preinstalled.
    # A volume created by postgres:16-alpine (musl) must be REINDEXed before use here:
    # glibc sorts text differently and the old indexes silently stop matching. See
    # docs/OPERATIONS.md.
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container shell, so the values never land in docker inspect.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  analyzer:
    # One-shot: extracts the skills of new jobs and scores them with tfidf-v1, then exits.
    build:
      context: ./analyzer/
      dockerfile: ./Dockerfile
    image: analyzer:latest
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      CV_PATH: /app/cv.md
    volumes:
      - ./cv.md:/app/cv.md:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  jev-worker:
    # Same image as analyzer, different command: every 15 min, brings each new job up to
    # date for the digest's model (language, skills, Jev answers, score).
    # Off by default (profile "jev"): without JEV_API_KEY the worker exits 1, and with
    # restart: unless-stopped that would be a restart loop. Turn it on with
    # COMPOSE_PROFILES=jev in .env, next to the key.
    profiles: ["jev"]
    image: analyzer:latest
    build:
      context: ./analyzer/
      dockerfile: ./Dockerfile
    command: ["uv", "run", "--no-dev", "--group", "jev", "python", "-m", "scripts.jev_worker"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      JEV_API_KEY: ${JEV_API_KEY}
      JEV_WORKER_INTERVAL_SECONDS: ${JEV_WORKER_INTERVAL_SECONDS:-900}
      CV_PATH: /app/cv.md
    volumes:
      - ./cv.md:/app/cv.md:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  digest:
    # No profile, unlike jev-worker: without DISCORD_WEBHOOK_URL the digest prints to its
    # log and the cycle succeeds, so a missing value never turns into a restart loop.
    build:
      context: .
      dockerfile: ./Dockerfile
    image: job-searcher:latest
    command: ["./radar", "digest-loop"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
