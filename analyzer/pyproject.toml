[project]
name = "analyzer"
version = "0.1.0"
description = "Scores job-radar jobs against the CV (Python side of the project)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.9",
]
eda = [
    "ipython>=9.17.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]
