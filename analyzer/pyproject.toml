[project]
name = "analyzer"
version = "0.1.0"
description = "Scores job-radar jobs against the CV (Python side of the project)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langdetect>=1.0.9",
    "psycopg[binary]>=3.3.6",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
eda = [
    "ipython>=9.17.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]
embed = [
    "sentence-transformers>=6.2.0",
]
jev = [
    "typesafe-sdk>=0.7.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# scikit-learn ships no type stubs or py.typed marker, so --strict flags its imports
# as untyped. Silence it for that package only; our own code stays strictly typed.
[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

# sentence-transformers also ships no stubs; same treatment as sklearn.
[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

# langdetect ships no stubs; same treatment.
[[tool.mypy.overrides]]
module = "langdetect.*"
ignore_missing_imports = true
