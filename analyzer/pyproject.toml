[project]
name = "jobradar-analyzer"
version = "1.0.0"
description = "Python side of job-radar: skill extraction, Jev answers, models and evaluation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.5.2",
    "langdetect>=1.0.9",
    "numpy>=2.3",
    "psycopg[binary]>=3.3.6",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
embed = [
    "sentence-transformers>=6.2.0",
]
jev = [
    "typesafe-sdk>=0.7.5",
]

[tool.ruff.lint]
# The desktop's SSD mount marks every file executable; git still stores them as 100644.
ignore = ["EXE002"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["jobradar", "scripts", "tests"]

# scikit-learn ships no type stubs or py.typed marker, so --strict flags its imports
# as untyped. Silence it for that package only; our own code stays strictly typed.
[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

# sentence-transformers also ships no stubs; same treatment as sklearn.
[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

# langdetect ships no stubs; same treatment.
[[tool.mypy.overrides]]
module = "langdetect.*"
ignore_missing_imports = true

# joblib ships no py.typed marker; same treatment.
[[tool.mypy.overrides]]
module = "joblib.*"
ignore_missing_imports = true
